name: PR05 — проверка отчёта

on: [push, pull_request]

jobs:
  evidence:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    timeout-minutes: 15
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w08-aea8efd0a516.tar.gz
      COURSE_KIT_SHA256: aea8efd0a51668af63f2e475b82bfa28bd76c21f20d8afea6b136d43a56a88fb
    steps:
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
          rm course-kit.tar.gz
      - name: Проверить JSON и совпадение версии архива
        shell: bash
        run: |
          python3 -m json.tool evidence/pr05/report.json > /dev/null
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr05/report.json').read_text())
          if report['course_kit']['archive_sha256'] != os.environ['COURSE_KIT_SHA256']:
              raise SystemExit('SHA-256 комплекта в отчёте отличается от архива CI')
          PYTHON
      - name: Build and test packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          colcon test --packages-select turtle_bringup patrol course_bringup \
            --event-handlers console_direct+
          colcon test-result --verbose
          python3 -m py_compile src/course_bringup/launch/patrol.launch.py
      - name: Проверить комплектность evidence и коммит реализации
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
